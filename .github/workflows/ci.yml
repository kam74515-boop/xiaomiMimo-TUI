name: ci

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: gofmt -w $(find . -name '*.go' -not -path './.git/*')
      - run: git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
